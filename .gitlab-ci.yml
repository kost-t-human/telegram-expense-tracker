trigger-deploys:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache curl
    - curl -X POST --fail -F token=$TRIGGER_TOKEN_MY -F ref=main https://gitlab.com/api/v4/projects/82212316/trigger/pipeline
    - curl -X POST --fail -F token=$TRIGGER_TOKEN_ROBOFOX -F ref=main https://gitlab.com/api/v4/projects/82212322/trigger/pipeline
  only:
    - main
